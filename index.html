<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>go</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/world.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<!-- The gate: deliberately plain. No styling touches anything in here. -->
<div id="gate">
<form id="goForm">
go<br>
<input id="goId" name="username" type="text" placeholder="id" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><br>
<input id="goPw" name="password" type="password" placeholder="password" autocomplete="current-password">
<button id="goBtn" type="submit">→</button>
</form>
<p id="goMsg"></p>
<form id="applyForm">
申請<br>
<input id="applyId" name="new-username" type="text" placeholder="id" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><br>
<input id="applyPw" name="new-password" type="password" placeholder="password" autocomplete="new-password">
<button id="applyBtn" type="submit">→</button>
</form>
<p id="applyMsg"></p>
</div>

<!-- The other side. -->
<div id="world" class="world start" hidden>
  <canvas id="field" class="field" aria-hidden="true"></canvas>

  <div class="hud">
    <span class="hud-state" id="hudState"><i></i><b id="hudText">LINKING</b></span>
    <button class="ghost" id="exitBtn" type="button" title="終了して全部消す" aria-label="終了して全部消す">
      <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </div>

  <div class="bar" id="bar">
    <div class="nav">
      <button class="ghost" id="backBtn" type="button" aria-label="戻る" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ghost" id="fwdBtn" type="button" aria-label="進む" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="ghost" id="reloadBtn" type="button" aria-label="再読み込み"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
    </div>
    <form class="omni" id="omni" autocomplete="off">
      <span class="omni-mark" aria-hidden="true"></span>
      <input id="address" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="URL か検索ワード" aria-label="URL か検索ワード">
      <span class="omni-scan" aria-hidden="true"></span>
    </form>
    <div class="tabs" id="tabs" role="tablist" aria-label="タブ"></div>
    <div class="nav">
      <button class="ghost" id="newTabBtn" type="button" aria-label="新しいタブ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ghost" id="exitBtn2" type="button" title="終了して全部消す" aria-label="終了して全部消す"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="screen" tabindex="-1" aria-label="ページの画面"></canvas>
    <textarea id="kbd" class="kbd" aria-label="キーボード入力" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-box">
      <p class="veil-title" id="veilTitle"></p>
      <p class="veil-text" id="veilText"></p>
      <button class="veil-btn" id="veilBtn" type="button" hidden>もう一度つなぐ</button>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<canvas id="warp" class="warp" hidden aria-hidden="true"></canvas>

<!-- Admin control panel (shown when an admin logs in at the gate) -->
<div id="admin" class="admin" hidden>
  <header class="adm-top">
    <div class="adm-brand"><span class="adm-dot"></span>ORBIT CONTROL</div>
    <div class="adm-right">
      <span class="adm-who" id="admWho"></span>
      <button class="adm-ghost" id="admRefresh" type="button" title="更新">⟳</button>
      <button class="adm-ghost" id="admLogout" type="button">ログアウト</button>
    </div>
  </header>

  <div class="adm-stats" id="admStats"></div>

  <main class="adm-grid">
    <section class="adm-card adm-wide">
      <h2>申請・利用者 <span class="adm-count" id="admAppCount"></span></h2>
      <div class="adm-filter" id="admFilter">
        <button class="adm-chip on" data-f="all" type="button">すべて</button>
        <button class="adm-chip" data-f="pending" type="button">審査待ち</button>
        <button class="adm-chip" data-f="approved" type="button">承認済み</button>
        <button class="adm-chip" data-f="rejected" type="button">却下</button>
      </div>
      <div class="adm-table-wrap"><table class="adm-table" id="admApps"><tbody></tbody></table></div>
      <p class="adm-empty" id="admAppsEmpty" hidden>まだ申請はありません。</p>
    </section>

    <section class="adm-card">
      <h2>いま使っている人 <span class="adm-count" id="admSessCount"></span></h2>
      <div class="adm-list" id="admSessions"></div>
      <p class="adm-empty" id="admSessEmpty" hidden>いまは誰も使っていません。</p>
    </section>

    <section class="adm-card">
      <h2>管理者</h2>
      <div class="adm-list" id="admAdmins"></div>
      <form class="adm-addform" id="admAddAdmin">
        <input id="admNewId" type="text" placeholder="新しい管理者 ID" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input id="admNewPw" type="password" placeholder="パスワード" autocomplete="new-password">
        <button class="adm-btn" type="submit">追加</button>
      </form>
      <p class="adm-msg" id="admAdminMsg" hidden></p>
    </section>

    <section class="adm-card adm-wide">
      <h2>設定</h2>
      <form class="adm-settings" id="admSettings"></form>
      <div class="adm-settings-foot">
        <button class="adm-btn primary" id="admSaveSettings" type="submit" form="admSettings">保存する</button>
        <span class="adm-msg inline" id="admSettingsMsg"></span>
      </div>
    </section>
  </main>
</div>

<script src="assets/config.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
